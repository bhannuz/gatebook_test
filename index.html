<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Gatebook — Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F0F4FF; --surface:#FFFFFF; --surface2:#F7F9FF; --surface3:#EDF0FB;
  --border:rgba(99,102,241,0.10); --border2:rgba(99,102,241,0.18); --border3:rgba(99,102,241,0.30);
  --text:#1E1B4B; --text2:#6366A8; --muted:#A5A8D0;
  --indigo:#6366F1; --indigo2:#4F46E5; --indigo-bg:rgba(99,102,241,0.08); --indigo-glow:rgba(99,102,241,0.20);
  --green:#059669; --green-bg:#ECFDF5; --green-border:#A7F3D0; --green-txt:#065F46;
  --red:#DC2626; --red-bg:#FEF2F2; --red-border:#FECACA; --red-txt:#991B1B;
  --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:20px; --r-2xl:28px;
  --shadow-sm:0 1px 3px rgba(99,102,241,0.06),0 1px 2px rgba(0,0,0,0.04);
  --shadow:0 4px 16px rgba(99,102,241,0.10),0 1px 4px rgba(0,0,0,0.05);
  --shadow-xl:0 24px 64px rgba(99,102,241,0.18);
  --font:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;
}
html{font-size:16px;-webkit-font-smoothing:antialiased}
body{font-family:var(--font);background:linear-gradient(135deg,#EEF2FF 0%,#F0F9FF 50%,#FDF4FF 100%);
  color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem}

/* ── Card ── */
.card{
  background:#fff;border-radius:var(--r-2xl);
  padding:40px 44px;width:min(440px,100%);
  box-shadow:var(--shadow-xl);border:1.5px solid var(--border2);
}
.brand{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:32px;flex-direction:column}
.brand-inner{display:flex;align-items:center;gap:12px}
.brand-logo{
  width:52px;height:52px;border-radius:16px;
  background:linear-gradient(135deg,#6366F1,#8B5CF6);
  display:flex;align-items:center;justify-content:center;
  font-size:24px;color:#fff;
  box-shadow:0 8px 24px rgba(99,102,241,0.35);
}
.brand-name{font-size:26px;font-weight:800;color:var(--text);letter-spacing:-.6px}
.brand-name em{font-style:normal;color:var(--indigo)}
.brand-tag{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.8px;text-transform:uppercase;text-align:center}

.card-title{font-size:20px;font-weight:800;color:var(--text);letter-spacing:-.3px;margin-bottom:6px}
.card-sub{font-size:13px;color:var(--text2);font-weight:500;margin-bottom:28px;line-height:1.6}

/* ── Tabs ── */
.tabs{display:flex;gap:0;background:var(--surface3);border:1px solid var(--border2);
  border-radius:var(--r-md);padding:4px;margin-bottom:24px}
.tab-btn{flex:1;padding:8px 0;border-radius:var(--r-sm);font-size:13px;font-weight:700;
  color:var(--text2);cursor:pointer;border:none;background:transparent;
  font-family:var(--font);transition:all .2s}
.tab-btn.active{background:#fff;color:var(--indigo);box-shadow:var(--shadow-sm)}

/* ── Form ── */
.fg{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.fg label{font-size:11px;font-weight:800;color:var(--text2);text-transform:uppercase;letter-spacing:.6px}
.fg input{
  background:var(--surface2);border:1.5px solid var(--border2);
  color:var(--text);font-family:var(--font);font-size:13px;font-weight:600;
  border-radius:var(--r-md);padding:11px 13px;outline:none;width:100%;
  transition:border-color .18s,box-shadow .18s;
}
.fg input::placeholder{color:var(--muted);font-weight:400}
.fg input:focus{border-color:var(--indigo);box-shadow:0 0 0 3px rgba(99,102,241,.12);background:#fff}

.pw-wrap{position:relative}
.pw-wrap input{padding-right:42px}
.pw-toggle{position:absolute;right:12px;top:50%;transform:translateY(-50%);
  background:none;border:none;cursor:pointer;color:var(--muted);font-size:18px;
  display:flex;align-items:center;padding:0;transition:color .15s}
.pw-toggle:hover{color:var(--indigo)}

/* ── Buttons ── */
.btn-primary{
  width:100%;padding:12px;border-radius:var(--r-md);
  font-size:14px;font-weight:800;font-family:var(--font);
  cursor:pointer;border:none;transition:all .18s;letter-spacing:.1px;
  background:linear-gradient(135deg,#6366F1,#8B5CF6);color:#fff;
  box-shadow:0 4px 16px rgba(99,102,241,0.30);
  display:flex;align-items:center;justify-content:center;gap:8px;
  margin-top:8px;
}
.btn-primary:hover{box-shadow:0 6px 24px rgba(99,102,241,0.45);transform:translateY(-1px)}
.btn-primary:active{transform:scale(.98)}
.btn-primary:disabled{opacity:.65;transform:none;cursor:not-allowed}

.divider{display:flex;align-items:center;gap:10px;margin:20px 0;color:var(--muted);font-size:12px;font-weight:600}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border2)}

.register-link{text-align:center;font-size:13px;color:var(--text2);font-weight:500}
.register-link a{color:var(--indigo);font-weight:700;text-decoration:none}
.register-link a:hover{text-decoration:underline}

/* ── Alert ── */
.alert{
  padding:11px 14px;border-radius:var(--r-md);font-size:13px;font-weight:600;
  display:none;align-items:center;gap:8px;margin-bottom:14px;
}
.alert.error{background:var(--red-bg);color:var(--red-txt);border:1.5px solid var(--red-border)}
.alert.success{background:var(--green-bg);color:var(--green-txt);border:1.5px solid var(--green-border)}
.alert.show{display:flex}
.alert i{font-size:16px;flex-shrink:0}

/* ── Loading overlay ── */
#pageLoad{
  position:fixed;inset:0;z-index:9999;
  background:linear-gradient(135deg,#EEF2FF 0%,#F0F9FF 50%,#FDF4FF 100%);
  display:flex;align-items:center;justify-content:center;
}
.lo-card{
  background:#fff;border-radius:var(--r-2xl);padding:40px 48px;text-align:center;
  box-shadow:var(--shadow-xl);display:flex;flex-direction:column;align-items:center;gap:18px;
  border:1px solid var(--border2);
}
.lo-icon{
  width:72px;height:72px;border-radius:20px;
  background:linear-gradient(135deg,#6366F1,#8B5CF6);
  display:flex;align-items:center;justify-content:center;
  font-size:32px;color:#fff;
  box-shadow:0 8px 24px rgba(99,102,241,0.35);
  animation:loPulse 2s ease-in-out infinite;
}
@keyframes loPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.lo-title{font-size:26px;font-weight:800;color:var(--text);letter-spacing:-.5px}
.lo-title span{background:linear-gradient(90deg,#6366F1,#8B5CF6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.lo-sub{font-size:13px;color:var(--text2)}
.lo-bar{width:200px;height:4px;background:var(--surface3);border-radius:99px;overflow:hidden}
.lo-fill{height:100%;background:linear-gradient(90deg,#6366F1,#8B5CF6,#06B6D4);background-size:200%;animation:loSlide 1.6s ease-in-out infinite}
@keyframes loSlide{0%{background-position:0%}100%{background-position:200%}}
.role-toggle{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:20px}
.rt-lbl{font-size:14px;font-weight:700;color:var(--text2);cursor:pointer;transition:color .2s;user-select:none}
.rt-lbl.active{color:var(--text)}
.rt-sw{position:relative;width:58px;height:34px;border-radius:99px;border:0;background:#C7CBE6;cursor:pointer;padding:0;transition:background .25s;flex-shrink:0}
.rt-sw[aria-checked="true"]{background:var(--indigo2)}
.rt-knob{position:absolute;top:2px;left:2px;width:30px;height:30px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3);transition:transform .25s}
.rt-sw[aria-checked="true"] .rt-knob{transform:translateX(24px)}
.rt-sw:focus-visible{outline:3px solid var(--indigo-glow);outline-offset:2px}
.opt-row{display:flex;gap:10px}
.opt-btn{flex:1;display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:12px 14px;background:#fff;border:1.5px solid var(--border2);border-radius:var(--r-md);text-decoration:none;color:var(--text);font-size:13px}
.opt-btn i{font-size:20px;color:var(--indigo);margin-bottom:4px}
.opt-btn span{font-size:11px;color:var(--text2);font-weight:500}
.opt-btn:hover{border-color:var(--indigo);background:var(--indigo-bg)}
</style>
</head>
<body>

<!-- Loading overlay (shown while checking auth state) -->
<div id="pageLoad">
  <div class="lo-card">
    <div class="lo-icon"><i class="ti ti-book-2"></i></div>
    <div class="lo-title">Gate<span>book</span></div>
    <div class="lo-sub">Checking authentication…</div>
    <div class="lo-bar"><div class="lo-fill"></div></div>
  </div>
</div>

<div class="card" id="mainCard" style="display:none">
  <div class="brand">
    <div class="brand-inner">
      <div class="brand-logo"><i class="ti ti-book-2"></i></div>
      <div class="brand-name">Gate<em>book</em></div>
    </div>
    <div class="brand-tag">Smart Society Management</div>
  </div>

  <div class="role-toggle" id="roleToggle">
    <span class="rt-lbl active" id="rtAdmin" onclick="setRole('admin')">Admin</span>
    <button type="button" class="rt-sw" id="rtSw" role="switch" aria-checked="false" aria-label="Flat member sign in" onclick="toggleRole()"><span class="rt-knob"></span></button>
    <span class="rt-lbl" id="rtMember" onclick="setRole('member')">Flat member</span>
  </div>

  <!-- ── LOGIN FORM ── -->
  <div id="loginForm">
    <div class="card-title">Welcome back</div>
    <div class="card-sub" id="loginSub">Sign in with your mobile number or email.</div>

    <div class="alert" id="loginAlert"><i class="ti ti-alert-circle"></i><span id="loginAlertMsg"></span></div>

    <div class="fg">
      <label id="loginIdLbl">Mobile number or Email</label>
      <input type="text" id="loginId" placeholder="9876543210 or you@example.com" autocomplete="username"/>
    </div>
    <div class="fg">
      <label style="display:flex;justify-content:space-between;align-items:center;">
        <span id="loginPwLbl">Password</span>
        <a href="#" id="forgotLink" onclick="showForgot();return false;"
          style="font-size:11px;font-weight:600;color:var(--indigo);text-decoration:none;">Forgot password?</a>
      </label>
      <div class="pw-wrap">
        <input type="password" id="loginPassword" placeholder="Your password" autocomplete="current-password"/>
        <button class="pw-toggle" type="button" onclick="togglePw('loginPassword',this)"><i class="ti ti-eye"></i></button>
      </div>
    </div>

    <button class="btn-primary" id="loginBtn" onclick="doLogin()">
      <i class="ti ti-login"></i><span id="loginBtnLbl">Sign In</span>
    </button>

    <div class="divider">or</div>
    <div class="register-link" id="loginAlt">
      New society? <a href="register.html">Register your apartment</a>
    </div>
  </div>

  <!-- ── FORGOT PASSWORD ── -->
  <div id="forgotForm" style="display:none">
    <div class="card-title">Reset Password</div>
    <div class="card-sub">Enter your registered email address to receive a password reset link.</div>

    <div class="alert" id="forgotAlert"><i class="ti ti-alert-circle"></i><span id="forgotAlertMsg"></span></div>

    <div class="fg">
      <label>Email Address</label>
      <input type="email" id="forgotId" placeholder="you@example.com" autocomplete="email"/>
    </div>

    <button class="btn-primary" id="forgotBtn" onclick="doForgot()">
      <i class="ti ti-send"></i><span id="forgotBtnLbl">Send Reset Link</span>
    </button>

    <div style="margin-top:14px;text-align:center;">
      <a href="#" onclick="showTab('login');return false;"
        style="font-size:12px;font-weight:600;color:var(--indigo);text-decoration:none;">
        ← Back to Sign In
      </a>
    </div>
  </div>
</div>

<script type="module">
import { auth, db } from './js/firebase.js';
import {
  signInWithEmailAndPassword, onAuthStateChanged, sendPasswordResetEmail, signOut,
} from 'https://www.gstatic.com/firebasejs/11.8.1/firebase-auth.js';
import { doc, getDoc } from 'https://www.gstatic.com/firebasejs/11.8.1/firebase-firestore.js';
import { resolveRole, pinToPassword, isValidMobile, isValidPin, PLATFORM_ADMIN_EMAIL } from './js/roles.js';

let SEL = sessionStorage.getItem('gb_intent') === 'member' ? 'member' : 'admin';
let busy = false;   // true while doLogin runs (blocks the auto-redirect)

const $ = id => document.getElementById(id);
const FORMS = ['loginForm', 'forgotForm'];

function showAlert(id, msg, type='error') { $(id+'Msg').textContent = msg; $(id).className = 'alert show ' + type; }
function hideAlert(id) { $(id).className = 'alert'; }
function setLoading(btnId, lblId, on, text) { $(btnId).disabled = on; $(lblId).textContent = text; }
function showCard() { const l = $('pageLoad'); if (l) l.style.display = 'none'; $('mainCard').style.display = ''; }
function show(id) { FORMS.forEach(f => $(f).style.display = f === id ? '' : 'none'); }
function chrome(on) { $('roleToggle').style.display = on ? '' : 'none'; }
function toEmail(raw) { return /^\d{10}$/.test(raw) ? raw + '@gatebook.app' : raw; }

/* ── Admin / Flat member toggle (iPhone-style) ── */
window.setRole = function(sel) {
  SEL = sel; sessionStorage.setItem('gb_intent', sel);
  const m = sel === 'member';
  $('rtSw').setAttribute('aria-checked', String(m));
  $('rtAdmin').classList.toggle('active', !m);
  $('rtMember').classList.toggle('active', m);
  $('loginSub').textContent = m ? 'Use the mobile number and 6-character code your admin gave you.' : 'Sign in to manage your apartment.';
  $('loginBtnLbl').textContent = m ? 'Sign in as Flat member' : 'Sign in as Admin';
  $('loginIdLbl').textContent = m ? 'Mobile number' : 'Mobile number or Email';
  $('loginId').placeholder = m ? '10-digit mobile number' : '9876543210 or you@example.com';
  $('loginId').inputMode = m ? 'numeric' : 'text';
  $('loginPwLbl').textContent = m ? '6-character code' : 'Password';
  $('loginPassword').placeholder = m ? '• • • • • •' : 'Your password';
  $('loginPassword').setAttribute('autocapitalize', m ? 'characters' : 'off');
  if (m) $('loginPassword').setAttribute('maxlength', '6'); else $('loginPassword').removeAttribute('maxlength');
  $('loginPassword').value = '';
  $('forgotLink').style.display = m ? 'none' : '';
  $('loginAlt').innerHTML = m
    ? 'No code yet? Ask your apartment admin to add you.<br>Forgot your code? Your admin can reset it.'
    : 'New society? <a href="register.html">Register your apartment</a>';
  hideAlert('loginAlert');
};
window.toggleRole = () => window.setRole(SEL === 'admin' ? 'member' : 'admin');

window.showTab = function(tab) { chrome(tab !== 'forgot'); show(tab === 'forgot' ? 'forgotForm' : 'loginForm'); hideAlert('loginAlert'); };
window.showForgot = function() { chrome(false); show('forgotForm'); };
window.togglePw = function(id, btn) {
  const inp = $(id), showIt = inp.type === 'password';
  inp.type = showIt ? 'text' : 'password';
  btn.querySelector('i').className = showIt ? 'ti ti-eye-off' : 'ti ti-eye';
};

/* ── Routing once we know who the user is ── */
async function route(user, fromLogin) {
  if (user.email === PLATFORM_ADMIN_EMAIL) { window.location.replace('admin.html'); return; }
  let r;
  try { r = await resolveRole(user); } catch (e) { console.error(e); r = { role: 'new' }; }

  // The toggle is only a label — verify it against the real account role.
  if (fromLogin) {
    const wrongAsMember = SEL === 'member' && r.role === 'admin';
    const wrongAsAdmin  = SEL === 'admin'  && r.role === 'member';
    if (wrongAsMember || wrongAsAdmin) {
      await signOut(auth); showCard(); showTab('login');
      showAlert('loginAlert', wrongAsMember
        ? 'This is an admin account. Switch to “Admin” to sign in.'
        : 'This is a flat member account. Switch to “Flat member” to sign in.');
      return;
    }
  }
  if (r.role === 'admin' || r.role === 'member') { window.location.replace('app.html'); return; }
  // signed in, but not an admin and not an added member
  if (SEL === 'member') {
    await signOut(auth); showCard(); showTab('login');
    showAlert('loginAlert', 'You have not been added to an apartment yet. Ask your admin to add you.');
    return;
  }
  window.location.replace('app.html');   // admin with no apartment yet → in-app setup wizard
}

onAuthStateChanged(auth, user => {
  if (busy) return;
  if (user) route(user, false);
  else { showCard(); window.setRole(SEL); }
});

/* ── Sign in ── */
window.doLogin = async function() {
  hideAlert('loginAlert');
  const raw = $('loginId').value.trim(), pw = $('loginPassword').value;
  const member = SEL === 'member';
  if (member) {
    if (!isValidMobile(raw)) { showAlert('loginAlert', 'Enter your 10-digit mobile number.'); return; }
    if (!isValidPin(pw))     { showAlert('loginAlert', 'Enter your 6-character code (letters and digits).'); return; }
  } else if (!raw || !pw) { showAlert('loginAlert', 'Enter your mobile/email and password.'); return; }

  const lbl = $('loginBtnLbl').textContent;
  busy = true; setLoading('loginBtn', 'loginBtnLbl', true, 'Signing in…');
  try {
    let email, password = pw;
    if (member) {
      const s = await getDoc(doc(db, 'phoneLogins', raw));
      if (!s.exists()) { showAlert('loginAlert', 'No flat member found for this number. Ask your admin to add you.'); return; }
      email = s.data().email; password = pinToPassword(raw, pw);
    } else email = toEmail(raw);
    const cred = await signInWithEmailAndPassword(auth, email, password);
    await route(cred.user, true);
  } catch (err) {
    const m = {
      'auth/invalid-credential': member ? 'Wrong mobile number or code.' : 'Wrong mobile/email or password.',
      'auth/user-not-found': 'No account found.',
      'auth/wrong-password': member ? 'Wrong code.' : 'Wrong password.',
      'auth/too-many-requests': 'Too many attempts. Wait a few minutes and try again.',
      'auth/invalid-email': 'Enter a valid mobile number or email.',
    };
    showAlert('loginAlert', m[err.code] || 'Sign in failed. Try again.');
  } finally { busy = false; setLoading('loginBtn', 'loginBtnLbl', false, lbl); }
};

/* ── Forgot password (admins only) ── */
window.doForgot = async function() {
  hideAlert('forgotAlert');
  const email = $('forgotId').value.trim();
  if (!email) { showAlert('forgotAlert', 'Enter your email address.'); return; }
  setLoading('forgotBtn', 'forgotBtnLbl', true, 'Sending…');
  try { await sendPasswordResetEmail(auth, email); showAlert('forgotAlert', 'Reset link sent. Check your inbox.', 'success'); }
  catch (e) { showAlert('forgotAlert', 'Could not send reset link. Check the email address.'); }
  finally { setLoading('forgotBtn', 'forgotBtnLbl', false, 'Send Reset Link'); }
};

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && $('loginForm').style.display !== 'none') window.doLogin();
});
</script>
</body>
</html>
